<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Шлях до зустрічі</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board: #ece0bd;
    --ink: #2b2820;
    --teal: #1f3a3d;
    --path-a: #7a2436;
    --path-a-dark: #4f1622;
    --path-b: #e0619a;
    --path-b-dark: #a83e6f;
    --gold: #c9a227;
    --amber: #b9822e;
    --amber-dark: #7a5218;
    --grand: #e2762f;
    --grand-dark: #8a2b12;
    --jungle-dark: #12261c;
    --jungle: #1f4430;
    --jungle-light: #2f6b45;
    --card: #fffaf0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 85% 8%, rgba(226,118,47,.35), transparent 40%),
      radial-gradient(circle at 15% 85%, rgba(47,107,69,.4), transparent 45%),
      radial-gradient(circle at 30% 20%, var(--jungle-light), var(--jungle-dark) 70%);
    font-family:'Manrope', system-ui, sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 14px 60px;
  }
  h1{
    font-family:'Baloo 2', system-ui, sans-serif;
    color:var(--board);
    font-size:clamp(24px,4vw,36px);
    margin:0 0 4px;
    text-align:center;
  }
  p.sub{
    color:#cbe0d0;
    margin:0 0 22px;
    text-align:center;
    max-width:600px;
    font-size:14px;
  }
  .board-wrap{
    position:relative;
    width:100%;
    max-width:1180px;
    background:
      repeating-linear-gradient(115deg, rgba(122,79,38,.05) 0 2px, transparent 2px 26px),
      var(--board);
    border-radius:22px;
    box-shadow:0 18px 40px rgba(0,0,0,.4), inset 0 0 0 6px #cdb374;
    padding:18px;
    overflow-x:auto;
  }
  .board-inner{
    position:relative;
    width:100%;
    min-width:900px;
    aspect-ratio: 1200/560;
  }
  svg{position:absolute;inset:0;width:100%;height:100%;}
  .node{
    position:absolute;
    width:7%;
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    border-radius:50% 50% 46% 46% / 58% 58% 42% 42%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:clamp(11px,1.5vw,16px);
    color:var(--card);
    border:3px solid rgba(0,0,0,.2);
    box-shadow:0 3px 0 rgba(0,0,0,.25);
    user-select:none;
    background-repeat:no-repeat;
  }
  .node.a{
    background-color:var(--path-a);
    background-image:
      radial-gradient(circle at 30% 28%, rgba(0,0,0,.28) 0 5%, transparent 6%),
      radial-gradient(circle at 62% 55%, rgba(0,0,0,.24) 0 6%, transparent 7%),
      radial-gradient(circle at 42% 72%, rgba(0,0,0,.22) 0 5%, transparent 6%);
  }
  .node.b{
    background-color:var(--path-b);
    background-image:
      radial-gradient(circle at 32% 30%, rgba(0,0,0,.2) 0 5%, transparent 6%),
      radial-gradient(circle at 60% 58%, rgba(0,0,0,.18) 0 6%, transparent 7%),
      radial-gradient(circle at 44% 74%, rgba(0,0,0,.16) 0 5%, transparent 6%);
  }
  .node.merge, .node.shared{
    background: radial-gradient(circle at 32% 28%, #e4c27a, var(--amber) 65%, var(--amber-dark) 100%);
    border-color: rgba(80,50,10,.4);
  }
  .node.merge{width:8.5%;}
  .node.shared{width:7.5%; opacity:.95;}
  .node.grand{
    background: radial-gradient(circle at 35% 28%, #ffcf7a, var(--grand) 55%, var(--grand-dark) 100%);
    width:13%;
    font-size:clamp(14px,2.2vw,22px);
    box-shadow:0 0 0 6px rgba(226,118,47,.3), 0 6px 0 rgba(0,0,0,.3);
    animation: pulse 2.4s ease-in-out infinite;
    border-color:#fff3;
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 6px rgba(226,118,47,.3), 0 6px 0 rgba(0,0,0,.3); }
    50%{ box-shadow:0 0 0 14px rgba(226,118,47,.14), 0 6px 0 rgba(0,0,0,.3); }
  }
  .token{
    position:absolute;
    width:11%;
    aspect-ratio:1;
    transform:translate(-50%,-88%);
    transition: left .6s cubic-bezier(.4,1.4,.5,1), top .6s cubic-bezier(.4,1.4,.5,1), transform .6s cubic-bezier(.4,1.4,.5,1);
    z-index:5;
    filter:drop-shadow(0 5px 4px rgba(0,0,0,.4));
  }
  .dino-svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
  .token.a .dino-svg .body-fill{fill:var(--path-a-dark);}
  .token.a .dino-svg .spike-fill{fill:var(--path-a);}
  .token.b .dino-svg .body-fill{fill:var(--path-b-dark);}
  .token.b .dino-svg .spike-fill{fill:var(--path-b);}
  .token-face{
    position:absolute;
    left:9%; top:16%;
    width:42%; height:42%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    z-index:2;
  }
  .token.a .token-face{border:4px solid var(--path-a-dark);}
  .token.b .token-face{border:4px solid var(--path-b-dark);}
  .controls{
    margin-top:22px;
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
  }
  button{
    font-family:'Baloo 2', sans-serif;
    font-size:15px;
    border:none;
    border-radius:12px;
    padding:12px 20px;
    cursor:pointer;
    color:var(--card);
    box-shadow:0 4px 0 rgba(0,0,0,.25);
    transition:transform .1s;
  }
  button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .btn-a{background:var(--path-a-dark);}
  .btn-b{background:var(--path-b-dark);}
  .btn-merge{background:var(--amber-dark);}
  .btn-reset{background:#4a4033;}
  .status{
    margin-top:14px;
    color:var(--board);
    font-size:14px;
    text-align:center;
    min-height:18px;
  }
  .overlay{
    position:fixed;inset:0;background:rgba(20,20,15,.72);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    z-index:50;
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal {
    background: var(--card);
    border-radius: 18px;
    max-width: 480px;
    width: 100%;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
}
  .modal.grand{ max-width:520px; box-shadow:0 0 0 6px rgba(179,67,107,.35), 0 24px 60px rgba(0,0,0,.5); }
  .modal img {
    width: 100%;
    height: 420px;
    display: block;
    object-fit: contain;
    background: var(--card);
}
  .modal-body {
    padding: 18px 20px 22px;
}
  .modal-body h3{
    font-family:'Baloo 2', sans-serif;
    margin:0 0 6px;
    font-size:20px;
  }
  .modal.grand .modal-body h3{font-size:26px; color:var(--grand-dark);}
  .modal-body p{margin:0 0 16px;font-size:14px;line-height:1.5;color:#4a463c;}
  .modal-body button{width:100%;background:var(--teal);}
  .modal.grand .modal-body button{background:var(--grand-dark);}
  .gallery{position:relative;}
  .gallery-nav{
    position:absolute; top:0; bottom:0; width:15%;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; cursor:pointer;
    color:#fff; font-size:26px; text-shadow:0 1px 4px rgba(0,0,0,.6);
    opacity:.85;
  }
  .gallery-nav:hover{opacity:1;}
  .gallery-nav.prev{left:0;}
  .gallery-nav.next{right:0;}
  .gallery-count{
    position:absolute; bottom:8px; right:10px;
    background:rgba(0,0,0,.55); color:#fff; font-size:12px;
    padding:2px 8px; border-radius:10px;
  }
  .hidden{display:none !important;}
</style>
</head>

<h1>🦖 Шлях до зустрічі</h1>
<p class="sub">Два динозаврики йдуть кожен своєю доісторичною стежкою. На кожній зупинці — фото. На точці 5 шляхи з'єднуються, а точка 9 — вулкан головної мети всієї подорожі.</p>

  d.style.left = (p.x/1200*100)+'%';
  d.style.top  = (p.y/560*100)+'%';
  d.textContent = text;
  nodesLayer.appendChild(d);
}
pathA.forEach((p,i)=> placeNode(p,'a', i===0? '🥚':i));
pathB.forEach((p,i)=> placeNode(p,'b', i===0? '🥚':i));
shared.forEach(p=> placeNode(p, p.node, p.label));

// ---- token positioning ----
const tokenA = document.getElementById('tokenA');
const tokenB = document.getElementById('tokenB');
function moveToken(el,p,offset){
  el.style.left = (p.x/1200*100)+'%';
  el.style.top  = (p.y/560*100)+'%';
  el.style.transform = offset || 'translate(-50%,-88%)';
}
moveToken(tokenA, pathA[0]);
moveToken(tokenB, pathB[0]);

// ---- game state ----
let idxA = 0, idxB = 0, atMergeA=false, atMergeB=false, sharedIdx = -1, merged=false;
const btnA = document.getElementById('btnA');
const btnB = document.getElementById('btnB');
const btnMerge = document.getElementById('btnMerge');
const btnReset = document.getElementById('btnReset');
const status = document.getElementById('status');

let galleryImages = [];
let galleryIdx = 0;
const galPrev = document.getElementById('galPrev');
const galNext = document.getElementById('galNext');
const galCount = document.getElementById('galCount');

function renderGalleryImage(){
  const modalImg = document.getElementById('modalImg');

if (galleryImages[galleryIdx].endsWith('.mp4')) {
    modalImg.style.display = 'none';

    let video = document.getElementById('modalVideo');

    if (!video) {
        video = document.createElement('video');
        video.id = 'modalVideo';
        video.controls = true;
        video.autoplay = true;
        video.style.width = '100%';
        video.style.height = '420px';
        video.style.objectFit = 'contain';
        document.querySelector('.gallery').prepend(video);
    }

    video.style.display = 'block';
    video.src = galleryImages[galleryIdx];
} else {
    modalImg.style.display = 'block';

    const video = document.getElementById('modalVideo');
    if (video) {
        video.pause();
        video.style.display = 'none';
    }

    modalImg.src = galleryImages[galleryIdx];
}
  const multi = galleryImages.length > 1;
  galPrev.classList.toggle('hidden', !multi);
  galNext.classList.toggle('hidden', !multi);
  galCount.classList.toggle('hidden', !multi);
  if(multi) galCount.textContent = (galleryIdx+1)+' / '+galleryImages.length;
}
galPrev.onclick = ()=>{ galleryIdx = (galleryIdx - 1 + galleryImages.length) % galleryImages.length; renderGalleryImage(); };
galNext.onclick = ()=>{ galleryIdx = (galleryIdx + 1) % galleryImages.length; renderGalleryImage(); };

function showModal(id, title, text, grand){
  galleryImages = photosFor(id);
  galleryIdx = 0;
  renderGalleryImage();
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalCard').classList.toggle('grand', !!grand);
  document.getElementById('overlay').classList.remove('hidden');
}
document.getElementById('modalClose').onclick = ()=> document.getElementById('overlay').classList.add('hidden');

function bothTogether(p){
  moveToken(tokenA, p, 'translate(-78%,-88%)');
  moveToken(tokenB, p, 'translate(-22%,-88%)');
}

function checkMergeReady(){
  if(atMergeA && atMergeB && !merged){
    merged = true;
    sharedIdx = 0;
    status.textContent = 'Обидва гравці дісталися точки 5! Тепер рухайтесь разом.';
    bothTogether(shared[0]);
    btnMerge.classList.remove('hidden');
    const t5 = titleOverrides['p5'] !== undefined ? titleOverrides['p5'] : "Точка 5 — з'єднання";
    setTimeout(()=> showModal('p5', t5, captions.p5, false), 300);
  }
}

btnA.onclick = ()=>{
  if(atMergeA) return;
  idxA++;
  if(idxA < pathA.length){
    moveToken(tokenA, pathA[idxA]);
    if(pathA[idxA].photo){
      const k = 'A'+idxA;
      const t = titleOverrides[k] !== undefined ? titleOverrides[k] : ('Точка '+pathA[idxA].label);
      showModal(k, t, captions[k], false);
    }
  } else {
    moveToken(tokenA, shared[0]);
    atMergeA = true;
    btnA.disabled = true;
    status.textContent = 'Гравець 1 чекає на точці 5…';
    checkMergeReady();
  }
};

btnB.onclick = ()=>{
  if(atMergeB) return;
  idxB++;
  if(idxB < pathB.length){
    moveToken(tokenB, pathB[idxB]);
    if(pathB[idxB].photo){
      const k = 'B'+idxB;
      const t = titleOverrides[k] !== undefined ? titleOverrides[k] : ('Точка '+pathB[idxB].label);
      showModal(k, t, captions[k], false);
    }
  } else {
    moveToken(tokenB, shared[0]);
    atMergeB = true;
    btnB.disabled = true;
    status.textContent = 'Гравець 2 чекає на точці 5…';
    checkMergeReady();
  }
};

btnMerge.onclick = ()=>{
  if(sharedIdx < shared.length-1){
    sharedIdx++;
    const p = shared[sharedIdx];
    bothTogether(p);
    const isGrand = p.node === 'grand';
    if(isGrand){
      status.textContent = 'Ви дійшли до точки 9 — головної мети подорожі!';
      btnMerge.classList.add('hidden');
    } else {
      status.textContent = 'Крок '+p.label+' з '+ (shared.length-1) +' пройдено разом.';
    }
    const defaultTitle = isGrand ? 'Точка 9 ✦ Головна мета' : ('Точка '+p.label);
    const t = titleOverrides[p.key] !== undefined ? titleOverrides[p.key] : defaultTitle;
    setTimeout(()=> showModal(p.key, t, captions[p.key], isGrand), 300);
  }
};

btnReset.onclick = ()=>{
  idxA=0; idxB=0; atMergeA=false; atMergeB=false; sharedIdx=-1; merged=false;
  btnA.disabled=false; btnB.disabled=false;
  btnMerge.classList.add('hidden');
  moveToken(tokenA, pathA[0]);
  moveToken(tokenB, pathB[0]);
  status.textContent = 'Хід за обома гравцями — тисніть кнопки, щоб рухатись.';
};
</script>
</body>
</html>
